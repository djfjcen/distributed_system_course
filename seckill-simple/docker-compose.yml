services:
  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: seckill-nacos
    restart: always
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"

  mysql-master:
    image: mysql:8.0
    container_name: seckill-mysql-master
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: seckill_demo
      TZ: UTC
    ports:
      - "3307:3306"
    command:
      - --default-authentication-plugin=mysql_native_password
      - --server-id=1
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --gtid_mode=ON
      - --enforce-gtid-consistency=ON
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - mysql_master_data:/var/lib/mysql
      - ./mysql/master/init:/docker-entrypoint-initdb.d:ro

  mysql-slave:
    image: mysql:8.0
    container_name: seckill-mysql-slave
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      TZ: UTC
    ports:
      - "3308:3306"
    command:
      - --default-authentication-plugin=mysql_native_password
      - --server-id=2
      - --relay-log=relay-bin
      - --log-bin=mysql-bin
      - --gtid_mode=ON
      - --enforce-gtid-consistency=ON
      - --read-only=ON
      - --super-read-only=ON
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 15
    depends_on:
      mysql-master:
        condition: service_healthy
    volumes:
      - mysql_slave_data:/var/lib/mysql
      - ./mysql/slave/init:/docker-entrypoint-initdb.d:ro

  mysql-replica-setup:
    image: mysql:8.0
    container_name: seckill-mysql-replica-setup
    depends_on:
      mysql-master:
        condition: service_healthy
      mysql-slave:
        condition: service_healthy
    restart: "no"
    command:
      - /bin/bash
      - -c
      - |
        set -e
        until mysql -hmysql-master -uroot -proot -e "SELECT 1"; do sleep 2; done
        until mysql -hmysql-slave -uroot -proot -e "SELECT 1"; do sleep 2; done
        mysql -hmysql-slave -uroot -proot -e "STOP REPLICA;"
        mysql -hmysql-slave -uroot -proot -e "CHANGE REPLICATION SOURCE TO SOURCE_HOST='mysql-master', SOURCE_PORT=3306, SOURCE_USER='repl', SOURCE_PASSWORD='repl123', SOURCE_AUTO_POSITION=1, GET_SOURCE_PUBLIC_KEY=1;"
        mysql -hmysql-slave -uroot -proot -e "START REPLICA;"
        mysql -hmysql-slave -uroot -proot -e "SHOW REPLICA STATUS\\G"

  redis:
    image: redis:7-alpine
    container_name: seckill-redis
    restart: always
    ports:
      - "6379:6379"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.3
    container_name: seckill-elasticsearch
    restart: always
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: seckill-zookeeper
    restart: always
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: seckill-kafka
    restart: always
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9092"]
      interval: 5s
      timeout: 10s
      retries: 5

  shardingsphere-proxy:
    image: apache/shardingsphere-proxy:5.5.1
    container_name: seckill-shardingsphere-proxy
    restart: always
    depends_on:
      mysql-master:
        condition: service_healthy
    ports:
      - "3309:3307"
    volumes:
      - ./shardingsphere-proxy/conf/server.yaml:/opt/shardingsphere-proxy/conf/server.yaml:ro
      - ./shardingsphere-proxy/conf/config-sharding.yaml:/opt/shardingsphere-proxy/conf/config-sharding.yaml:ro
      - C:/Users/mazhi/.m2/repository/com/mysql/mysql-connector-j/8.3.0/mysql-connector-j-8.3.0.jar:/opt/shardingsphere-proxy/ext-lib/mysql-connector-j-8.3.0.jar:ro

  backend-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: seckill-backend-1
    restart: always
    environment:
      DB_WRITE_HOST: shardingsphere-proxy
      DB_WRITE_PORT: 3307
      DB_READ_HOST: shardingsphere-proxy
      DB_READ_PORT: 3307
      DB_NAME: seckill_proxy_db
      DB_USERNAME: root
      DB_PASSWORD: root
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ES_HOST: elasticsearch
      ES_PORT: 9200
      KAFKA_BROKER: kafka:9092
      NACOS_ADDR: nacos:8848
      SERVER_PORT: 8080
    depends_on:
      mysql-master:
        condition: service_healthy
      mysql-slave:
        condition: service_healthy
      mysql-replica-setup:
        condition: service_completed_successfully
      redis:
        condition: service_started
      elasticsearch:
        condition: service_started
      kafka:
        condition: service_healthy
      shardingsphere-proxy:
        condition: service_started
      nacos:
        condition: service_started
    ports:
      - "8081:8080"

  backend-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: seckill-backend-2
    restart: always
    environment:
      DB_WRITE_HOST: shardingsphere-proxy
      DB_WRITE_PORT: 3307
      DB_READ_HOST: shardingsphere-proxy
      DB_READ_PORT: 3307
      DB_NAME: seckill_proxy_db
      DB_USERNAME: root
      DB_PASSWORD: root
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ES_HOST: elasticsearch
      ES_PORT: 9200
      KAFKA_BROKER: kafka:9092
      NACOS_ADDR: nacos:8848
      SERVER_PORT: 8080
    depends_on:
      mysql-master:
        condition: service_healthy
      mysql-slave:
        condition: service_healthy
      mysql-replica-setup:
        condition: service_completed_successfully
      redis:
        condition: service_started
      elasticsearch:
        condition: service_started
      kafka:
        condition: service_healthy
      shardingsphere-proxy:
        condition: service_started
      nacos:
        condition: service_started
    ports:
      - "8082:8080"

  nginx:
    image: nginx:1.27-alpine
    container_name: seckill-nginx
    restart: always
    depends_on:
      - backend-1
      - backend-2
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/usr/share/nginx/html:ro

volumes:
  mysql_master_data:
  mysql_slave_data:
