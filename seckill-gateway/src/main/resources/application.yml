server:
  port: 8088

spring:
  application:
    name: seckill-gateway
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:127.0.0.1:8848}
      discovery:
        enabled: true
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: seckill-simple-route
          uri: lb://seckill-simple
          predicates:
            - Path=/seckill/**
          filters:
            - StripPrefix=1
        - id: seckill-govern-route
          uri: lb://seckill-simple
          predicates:
            - Path=/govern/**
          filters:
            - StripPrefix=1
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@ipKeyResolver}"
            - name: CircuitBreaker
              args:
                name: seckillTrafficCB
                fallbackUri: forward:/fallback/seckill
                statusCodes:
                  - 500

resilience4j:
  circuitbreaker:
    instances:
      seckillTrafficCB:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 20
        minimumNumberOfCalls: 10
        permittedNumberOfCallsInHalfOpenState: 5
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        slowCallDurationThreshold: 1000ms
        slowCallRateThreshold: 50
  timelimiter:
    instances:
      seckillTrafficCB:
        timeoutDuration: 1500ms

management:
  endpoints:
    web:
      exposure:
        include: health,info
