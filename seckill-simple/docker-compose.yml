services:
  mysql-master:
    image: mysql:8.0
    container_name: seckill-mysql-master
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: seckill_demo
      TZ: UTC
    ports:
      - "3307:3306"
    command:
      - --default-authentication-plugin=mysql_native_password
      - --server-id=1
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --gtid_mode=ON
      - --enforce-gtid-consistency=ON
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - mysql_master_data:/var/lib/mysql
      - ./mysql/master/init:/docker-entrypoint-initdb.d:ro

  mysql-slave:
    image: mysql:8.0
    container_name: seckill-mysql-slave
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      TZ: UTC
    ports:
      - "3308:3306"
    command:
      - --default-authentication-plugin=mysql_native_password
      - --server-id=2
      - --relay-log=relay-bin
      - --log-bin=mysql-bin
      - --gtid_mode=ON
      - --enforce-gtid-consistency=ON
      - --read-only=ON
      - --super-read-only=ON
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 15
    depends_on:
      mysql-master:
        condition: service_healthy
    volumes:
      - mysql_slave_data:/var/lib/mysql
      - ./mysql/slave/init:/docker-entrypoint-initdb.d:ro

  mysql-replica-setup:
    image: mysql:8.0
    container_name: seckill-mysql-replica-setup
    depends_on:
      mysql-master:
        condition: service_healthy
      mysql-slave:
        condition: service_healthy
    restart: "no"
    command:
      - /bin/bash
      - -c
      - |
        set -e
        until mysql -hmysql-master -uroot -proot -e "SELECT 1"; do sleep 2; done
        until mysql -hmysql-slave -uroot -proot -e "SELECT 1"; do sleep 2; done
        mysql -hmysql-slave -uroot -proot -e "STOP REPLICA;"
        mysql -hmysql-slave -uroot -proot -e "CHANGE REPLICATION SOURCE TO SOURCE_HOST='mysql-master', SOURCE_PORT=3306, SOURCE_USER='repl', SOURCE_PASSWORD='repl123', SOURCE_AUTO_POSITION=1, GET_SOURCE_PUBLIC_KEY=1;"
        mysql -hmysql-slave -uroot -proot -e "START REPLICA;"
        mysql -hmysql-slave -uroot -proot -e "SHOW REPLICA STATUS\\G"

  redis:
    image: redis:7-alpine
    container_name: seckill-redis
    restart: always
    ports:
      - "6379:6379"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.3
    container_name: seckill-elasticsearch
    restart: always
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"

  backend-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: seckill-backend-1
    restart: always
    environment:
      DB_WRITE_HOST: mysql-master
      DB_WRITE_PORT: 3306
      DB_READ_HOST: mysql-slave
      DB_READ_PORT: 3306
      DB_NAME: seckill_demo
      DB_USERNAME: root
      DB_PASSWORD: root
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ES_HOST: elasticsearch
      ES_PORT: 9200
      SERVER_PORT: 8080
    depends_on:
      mysql-master:
        condition: service_healthy
      mysql-slave:
        condition: service_healthy
      mysql-replica-setup:
        condition: service_completed_successfully
      redis:
        condition: service_started
      elasticsearch:
        condition: service_started
    ports:
      - "8081:8080"

  backend-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: seckill-backend-2
    restart: always
    environment:
      DB_WRITE_HOST: mysql-master
      DB_WRITE_PORT: 3306
      DB_READ_HOST: mysql-slave
      DB_READ_PORT: 3306
      DB_NAME: seckill_demo
      DB_USERNAME: root
      DB_PASSWORD: root
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ES_HOST: elasticsearch
      ES_PORT: 9200
      SERVER_PORT: 8080
    depends_on:
      mysql-master:
        condition: service_healthy
      mysql-slave:
        condition: service_healthy
      mysql-replica-setup:
        condition: service_completed_successfully
      redis:
        condition: service_started
      elasticsearch:
        condition: service_started
    ports:
      - "8082:8080"

  nginx:
    image: nginx:1.27-alpine
    container_name: seckill-nginx
    restart: always
    depends_on:
      - backend-1
      - backend-2
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/usr/share/nginx/html:ro

volumes:
  mysql_master_data:
  mysql_slave_data:
